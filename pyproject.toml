[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sav-bandnet"
version = "0.1.0"
description = "Spatial audio-visual target speech extraction for a circular six-microphone array"
requires-python = ">=3.11,<3.12"
dependencies = ["torch>=2.6,<2.8", "numpy", "scipy", "soundfile", "einops", "packaging"]

[project.scripts]
sav-bandnet-infer = "spatial_av_bandnet.infer:main"

[tool.setuptools.packages.find]
include = ["spatial_av_bandnet*", "third_party*"]
namespaces = true

[tool.setuptools.package-data]
"third_party.cmlr" = ["config.json"]
