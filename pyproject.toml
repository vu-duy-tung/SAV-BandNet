[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sav-bandnet"
version = "0.2.0"
description = "Spatial–audiovisual consistency for streaming target-speech extraction"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy", "scipy", "soundfile", "opencv-python", "einops", "asteroid-filterbanks", "huggingface-hub", "tqdm"]

[tool.setuptools.packages.find]
include = ["sav_bandnet*"]
